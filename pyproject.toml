[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maccluster"
version = "0.1.2"
description = "CLI tool for Thunderbolt-networked Apple Silicon Mac mini clusters (2–4 nodes)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "MacCluster Contributors" }]
keywords = ["thunderbolt", "macos", "cluster", "apple-silicon", "mac-mini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Clustering",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
monitor = ["rich>=13.7,<15"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pip-audit>=2.7",
]

[project.scripts]
maccluster = "maccluster.cli.main:main"

[project.urls]
Homepage = "https://github.com/maf4711/maccluster"
Documentation = "https://github.com/maf4711/maccluster#readme"
Repository = "https://github.com/maf4711/maccluster"
Issues = "https://github.com/maf4711/maccluster/issues"
Download = "https://github.com/maf4711/maccluster/archive/refs/heads/main.zip"
RawInstall = "https://raw.githubusercontent.com/maf4711/maccluster/main/install.sh"

[tool.hatch.build.targets.wheel]
packages = ["src/maccluster"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/Makefile",
  "/install.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
