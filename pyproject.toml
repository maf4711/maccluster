[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# "docsync" on PyPI belongs to an unrelated project; this distribution is "docsync-lan".
# Command and import name stay `docsync`. Distributed as a GitHub release wheel, not via PyPI.
name = "docsync-lan"
dynamic = ["version"]
description = "Bidirectional LAN sync of folders between Macs (rsync+ssh, 3-way merge, SafetyNet, Thunderbolt-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Föllmer" }]
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3", "Environment :: Console"]
dependencies = []

[project.scripts]
docsync = "docsync.cli:main"

[project.urls]
Source = "https://github.com/maf4711/docsync"

[tool.setuptools]
packages = ["docsync"]

[tool.setuptools.package-data]
docsync = ["resources/*.swift"]

[tool.setuptools.dynamic]
version = { attr = "docsync.__version__" }
